    name: RuiYan Linux x64 Package
    if: ${{ inputs.target == 'linux-x64' || inputs.target == 'all' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CI: ''
      NODE_OPTIONS: --max_old_space_size=4096
      INCLUDE_ENGINE: ${{ inputs.include_engine }}
      THE_LEGACY: ${{ inputs.legacy }}
      RENYAN_PACKAGE_ARCHITECTURE: x64
    steps:
      - name: 验证 RuiYan 构建分支与签名能力
        shell: bash
        env:
          PACKAGE_SIGNED: ${{ inputs.sign_installers }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "qsh" ]; then
            echo "只允许从 qsh 分支构建睿眼安装文件" >&2
            exit 1
          fi
          if [ "${PACKAGE_SIGNED}" = "true" ]; then
            echo "当前仓库没有 Linux 安装文件签名机制，请关闭安装文件签名" >&2
            exit 1
          fi


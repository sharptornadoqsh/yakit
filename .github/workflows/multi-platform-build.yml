name: RuiYan Multi-Platform Package

on:
  workflow_dispatch:
    inputs:
      target:
        description: 选择安装文件的平台和架构
        required: true
        type: choice
        default: macos-both
        options:
          - macos-x64
          - macos-arm64
          - macos-both
          - windows-x64
          - linux-x64
          - linux-arm64
          - all
      legacy:
        description: Windows/Linux 旧系统兼容模式（Electron 22.3.27）；macOS 保持默认
        required: false
        type: boolean
        default: false
      edition:
        description: 选择社区版、企业版或企业版免许可证客户端
        required: true
        type: choice
        default: community
        options:
          - community
          - enterprise
          - enterprise-no-license
      include_engine:
        description: 是否在安装文件中预置对应平台和架构的 Yak 引擎
        required: false
        type: boolean
        default: true
      engine_version:
        description: 预置引擎版本；留空时读取项目兼容清单中的推荐版本
        required: false
        type: string
      sign_installers:
        description: 是否启用安装文件签名；仓库未配置对应凭据时保持 false
        required: false
        type: boolean
        default: false
      retention_days:
        description: 安装文件产物的保留天数
        required: true
        type: choice
        default: '14'
        options:
          - '7'
          - '14'
          - '30'
      publish_release:
        description: 是否将本次构建产物发布到 GitHub Release
        required: false
        type: boolean
        default: false
      release_draft:
        description: 是否创建为 Draft Release；仅在发布 Release 时生效
        required: false
        type: boolean
        default: false
      release_prerelease:
        description: 是否标记为 Pre-release
        required: false
        type: boolean
        default: false
      overwrite_release_assets:
        description: 同名 Release 附件已存在时是否允许替换
        required: false
        type: boolean
        default: false
      release_tag:
        description: 自定义 Release Tag；留空时根据 package.json version 生成
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  RUIYAN_CHROME_EXTENSION_SHA256: f3a19aeb5bcd5cbcb94d6d648147b6e173dd1ed6db753f91882d58f3e6a20b41

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target }}-${{ inputs.edition }}-${{ inputs.legacy }}
  cancel-in-progress: ${{ !inputs.publish_release }}

jobs:
  build-macos-x64:
    name: RuiYan macOS x64 Package
    if: ${{ inputs.target == 'macos-x64' || inputs.target == 'macos-both' || inputs.target == 'all' }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      CI: ''
      NODE_OPTIONS: --max_old_space_size=4096
      INCLUDE_ENGINE: ${{ inputs.include_engine }}
      RENYAN_PACKAGE_ARCHITECTURE: x64
    steps:
      - name: 验证 RuiYan 构建分支
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "qsh" ]; then
            echo "只允许从 qsh 分支构建睿眼安装文件" >&2
            exit 1
          fi

      - name: 检出 RuiYan 源码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/renderer/src/main/yarn.lock
            app/renderer/engine-link-startup/yarn.lock

      - name: 安装固定依赖
        shell: bash
        run: |
          yarn install --frozen-lockfile
          yarn install-render --frozen-lockfile
          yarn install-link-render --frozen-lockfile

      - name: 证书名称重签回归
        shell: bash
        timeout-minutes: 5
        env:
          THE_LEGACY: 'false'
        run: yarn test:vitest --run --threads=false app/main/__test__/mitmCertificateBranding.test.js

      - name: 校验仓库内置浏览器扩展
        shell: bash
        run: |
          node -e "const fs=require('fs');const crypto=require('crypto');const file='bins/scripts/google-chrome-plugin.zip';if(!fs.existsSync(file))throw new Error('仓库内置浏览器扩展不存在');const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');if(actual!==process.env.RUIYAN_CHROME_EXTENSION_SHA256)throw new Error('浏览器扩展摘要不匹配')"

      - name: 构建 RuiYan 渲染器
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn build-renders-enterprise-no-license
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn build-renders-enterprise
          else
            yarn build-renders
          fi

      - name: 准备并校验 macOS x64 引擎
        if: ${{ inputs.include_engine }}
        id: engine
        shell: bash
        env:
          REQUESTED_ENGINE_VERSION: ${{ inputs.engine_version }}
          ENGINE_ASSET: yak_darwin_amd64
          DEFER_ENGINE_ARCHIVE: ${{ inputs.sign_installers }}
        run: node packageScript/script/prepare-renyan-engine.js prepare

      - name: 校验苹果签名凭据并导入证书
        if: ${{ inputs.sign_installers }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ENGINE_ASSET: yak_darwin_amd64
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CERT_BASE64 CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "缺少苹果签名凭据：${name}" >&2
              exit 1
            fi
          done
          chmod +x packageScript/script/signature.sh
          packageScript/script/signature.sh build
          if [ "${INCLUDE_ENGINE}" = "true" ]; then
            CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep -F "${APPLE_TEAM_ID}" | head -n1 | awk -F\" '{print $2}')
            if [ -z "${CERT_ID:-}" ]; then
              echo "未找到对应团队的苹果签名证书" >&2
              exit 1
            fi
            codesign --timestamp --options runtime --sign "${CERT_ID}" "bins/${ENGINE_ASSET}"
            node packageScript/script/prepare-renyan-engine.js archive
          fi

      - name: 生成 RuiYan macOS x64 无签名安装文件
        if: ${{ !inputs.sign_installers }}
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn pack-renyan-mac-x64-enterprise-no-license-unsigned
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn pack-renyan-mac-x64-enterprise-unsigned
          else
            yarn pack-renyan-mac-x64-unsigned
          fi

      - name: 生成 RuiYan macOS x64 签名安装文件
        if: ${{ inputs.sign_installers }}
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn pack-renyan-mac-x64-enterprise-no-license-signed
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn pack-renyan-mac-x64-enterprise-signed
          else
            yarn pack-renyan-mac-x64-signed
          fi

      - name: 验证成品引擎、签名与应用启动
        shell: bash
        env:
          PACKAGE_TARGET: macos-x64
          PACKAGE_SIGNED: ${{ inputs.sign_installers }}
        run: node packageScript/script/verify-renyan-package.js

      - name: 生成 RuiYan 构建清单与摘要
        id: metadata
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
          PACKAGE_TARGET: macos-x64
          PACKAGE_SIGNED: ${{ inputs.sign_installers }}
          INCLUDE_ENGINE: ${{ inputs.include_engine }}
        run: node packageScript/script/create-renyan-build-metadata.js

      - name: 上传 RuiYan macOS x64 产物
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.metadata.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: 清理苹果签名临时文件
        if: ${{ always() && inputs.sign_installers }}
        shell: bash
        run: |
          rm -f cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true

  build-macos-arm64:
    name: RuiYan macOS arm64 Package
    if: ${{ inputs.target == 'macos-arm64' || inputs.target == 'macos-both' || inputs.target == 'all' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: ''
      NODE_OPTIONS: --max_old_space_size=4096
      INCLUDE_ENGINE: ${{ inputs.include_engine }}
      RENYAN_PACKAGE_ARCHITECTURE: arm64
    steps:
      - name: 验证 RuiYan 构建分支
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "qsh" ]; then
            echo "只允许从 qsh 分支构建睿眼安装文件" >&2
            exit 1
          fi

      - name: 检出 RuiYan 源码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/renderer/src/main/yarn.lock
            app/renderer/engine-link-startup/yarn.lock

      - name: 安装固定依赖
        shell: bash
        run: |
          yarn install --frozen-lockfile
          yarn install-render --frozen-lockfile
          yarn install-link-render --frozen-lockfile

      - name: 证书名称重签回归
        shell: bash
        timeout-minutes: 5
        env:
          THE_LEGACY: 'false'
        run: yarn test:vitest --run --threads=false app/main/__test__/mitmCertificateBranding.test.js

      - name: 校验仓库内置浏览器扩展
        shell: bash
        run: |
          node -e "const fs=require('fs');const crypto=require('crypto');const file='bins/scripts/google-chrome-plugin.zip';if(!fs.existsSync(file))throw new Error('仓库内置浏览器扩展不存在');const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');if(actual!==process.env.RUIYAN_CHROME_EXTENSION_SHA256)throw new Error('浏览器扩展摘要不匹配')"

      - name: 构建 RuiYan 渲染器
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn build-renders-enterprise-no-license
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn build-renders-enterprise
          else
            yarn build-renders
          fi

      - name: 准备并校验 macOS arm64 引擎
        if: ${{ inputs.include_engine }}
        id: engine
        shell: bash
        env:
          REQUESTED_ENGINE_VERSION: ${{ inputs.engine_version }}
          ENGINE_ASSET: yak_darwin_arm64
          DEFER_ENGINE_ARCHIVE: ${{ inputs.sign_installers }}
        run: node packageScript/script/prepare-renyan-engine.js prepare

      - name: 校验苹果签名凭据并导入证书
        if: ${{ inputs.sign_installers }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ENGINE_ASSET: yak_darwin_arm64
        run: |
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CERT_BASE64 CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "缺少苹果签名凭据：${name}" >&2
              exit 1
            fi
          done
          chmod +x packageScript/script/signature.sh
          packageScript/script/signature.sh build
          if [ "${INCLUDE_ENGINE}" = "true" ]; then
            CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep -F "${APPLE_TEAM_ID}" | head -n1 | awk -F\" '{print $2}')
            if [ -z "${CERT_ID:-}" ]; then
              echo "未找到对应团队的苹果签名证书" >&2
              exit 1
            fi
            codesign --timestamp --options runtime --sign "${CERT_ID}" "bins/${ENGINE_ASSET}"
            node packageScript/script/prepare-renyan-engine.js archive
          fi

      - name: 生成 RuiYan macOS arm64 无签名安装文件
        if: ${{ !inputs.sign_installers }}
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn pack-renyan-mac-arm64-enterprise-no-license-unsigned
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn pack-renyan-mac-arm64-enterprise-unsigned
          else
            yarn pack-renyan-mac-arm64-unsigned
          fi

      - name: 生成 RuiYan macOS arm64 签名安装文件
        if: ${{ inputs.sign_installers }}
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
          APPLE_ID: ${{ secrets.APPLE_ACCOUNT_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn pack-renyan-mac-arm64-enterprise-no-license-signed
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn pack-renyan-mac-arm64-enterprise-signed
          else
            yarn pack-renyan-mac-arm64-signed
          fi

      - name: 验证成品引擎、签名与应用启动
        shell: bash
        env:
          PACKAGE_TARGET: macos-arm64
          PACKAGE_SIGNED: ${{ inputs.sign_installers }}
        run: node packageScript/script/verify-renyan-package.js

      - name: 生成 RuiYan 构建清单与摘要
        id: metadata
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
          PACKAGE_TARGET: macos-arm64
          PACKAGE_SIGNED: ${{ inputs.sign_installers }}
          INCLUDE_ENGINE: ${{ inputs.include_engine }}
        run: node packageScript/script/create-renyan-build-metadata.js

      - name: 上传 RuiYan macOS arm64 产物
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.metadata.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: 清理苹果签名临时文件
        if: ${{ always() && inputs.sign_installers }}
        shell: bash
        run: |
          rm -f cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true

  build-windows-x64:
    name: RuiYan Windows x64 Package
    if: ${{ inputs.target == 'windows-x64' || inputs.target == 'all' }}
    runs-on: windows-2022
    timeout-minutes: ${{ inputs.legacy && 120 || 60 }}
    env:
      CI: ''
      NODE_OPTIONS: --max_old_space_size=4096
      INCLUDE_ENGINE: ${{ inputs.include_engine }}
      THE_LEGACY: ${{ inputs.legacy }}
      RENYAN_PACKAGE_ARCHITECTURE: x64
    steps:
      - name: 验证 RuiYan 构建分支
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "qsh" ]; then
            echo "只允许从 qsh 分支构建睿眼安装文件" >&2
            exit 1
          fi

      - name: 初始化 Windows legacy 临时目录
        if: ${{ inputs.legacy }}
        shell: pwsh
        run: |
          $bundle = (Join-Path $env:RUNNER_TEMP 'ruiyan-windows-legacy-bundle').Replace('\', '/')
          "WINDOWS_LEGACY_BUNDLE=$bundle" >> $env:GITHUB_ENV

      - name: 检出 RuiYan 源码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/renderer/src/main/yarn.lock
            app/renderer/engine-link-startup/yarn.lock

      - name: 安装固定依赖
        shell: bash
        run: |
          yarn install --frozen-lockfile
          yarn install-render --frozen-lockfile
          yarn install-link-render --frozen-lockfile

      - name: 证书名称重签回归
        shell: bash
        timeout-minutes: 5
        env:
          THE_LEGACY: 'false'
        run: yarn test:vitest --run --threads=false app/main/__test__/mitmCertificateBranding.test.js

      - name: 配置旧系统兼容运行时
        if: ${{ inputs.legacy }}
        shell: bash
        run: yarn add --dev --exact electron@22.3.27

      - name: Windows legacy 主进程与打包回归
        if: ${{ inputs.legacy }}
        timeout-minutes: 10
        shell: bash
        env:
          THE_LEGACY: 'false'
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=commonjs <<'NODE' 2>&1 | tee reports/windows-legacy-main-runtime.log
          for (const name of ['vitest', '@testing-library/jest-dom']) {
            const manifest = require.resolve(`${name}/package.json`)
            console.log(JSON.stringify({ name, version: require(manifest).version, manifest: manifest.replace(/\\/g, '/') }))
          }
          NODE
          yarn test:vitest --run --threads=false \
            --reporter=default --reporter=junit --outputFile=reports/windows-legacy-main.junit.xml \
            app/main/__test__/renyanPackaging.test.js \
            app/main/__test__/packageStartupVerification.test.js \
            app/main/__test__/engineLifecycle.test.js \
            app/main/handlers/__test__/newEngineStatus.test.js \
            app/main/__test__/passwordTransport.test.js \
            app/main/__test__/ipcRegistration.test.js 2>&1 | tee reports/windows-legacy-main.log

      - name: Windows legacy 启动渲染回归
        if: ${{ inputs.legacy }}
        timeout-minutes: 10
        shell: bash
        working-directory: app/renderer/engine-link-startup
        env:
          THE_LEGACY: 'false'
        run: |
          set -euo pipefail
          mkdir -p ../../../reports
          node --input-type=commonjs <<'NODE' 2>&1 | tee ../../../reports/windows-legacy-renderer-runtime.log
          const { createRequire } = require('module')
          for (const name of ['vitest', '@testing-library/jest-dom']) {
            const manifest = require.resolve(`${name}/package.json`)
            console.log(JSON.stringify({ name, version: require(manifest).version, manifest: manifest.replace(/\\/g, '/') }))
          }
          const matcher = require.resolve('@testing-library/jest-dom/vitest')
          const matcherVitest = createRequire(matcher).resolve('vitest/package.json')
          console.log(JSON.stringify({ matcher: matcher.replace(/\\/g, '/'), vitest: matcherVitest.replace(/\\/g, '/') }))
          NODE
          yarn test --run --config vitest.config.ts --no-file-parallelism \
            --reporter=default --reporter=junit --outputFile=../../../reports/windows-legacy-renderer.junit.xml \
            src/pages/StartupPage/components/LocalEngine/__test__/index.test.tsx \
            src/pages/StartupPage/components/EngineLifecyclePanel/__test__/index.test.tsx \
            src/pages/StartupPage/__test__/engineLifecycle.test.ts \
            src/pages/StartupPage/__test__/startup-port.test.tsx 2>&1 | tee ../../../reports/windows-legacy-renderer.log

      - name: Windows legacy 源码语法与启动页类型检查
        if: ${{ inputs.legacy }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/packageScript/script/build-windows-legacy-engine.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          foreach ($file in @(
            'app/main/windowsLegacyEngine.js',
            'app/main/handlers/newEngineStatus.js',
            'packageScript/script/patch-windows-legacy-go.js',
            'packageScript/script/prepare-renyan-engine.js',
            'packageScript/script/verify-windows-legacy-startup.js',
            'packageScript/script/verify-renyan-package.js'
          )) { node --check $file }
          yarn --cwd app/renderer/engine-link-startup tsc --noEmit -p tsconfig.json

      - name: 下载固定 Windows legacy 引擎与运行库
        if: ${{ inputs.legacy && inputs.include_engine }}
        timeout-minutes: 60
        shell: pwsh
        env:
          REQUESTED_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: |
          ./packageScript/script/build-windows-legacy-engine.ps1 `
            -Output "$env:WINDOWS_LEGACY_BUNDLE"

      - name: 校验仓库内置浏览器扩展
        shell: bash
        run: |
          node -e "const fs=require('fs');const crypto=require('crypto');const file='bins/scripts/google-chrome-plugin.zip';if(!fs.existsSync(file))throw new Error('仓库内置浏览器扩展不存在');const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');if(actual!==process.env.RUIYAN_CHROME_EXTENSION_SHA256)throw new Error('浏览器扩展摘要不匹配')"

      - name: 构建 RuiYan 渲染器
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn build-renders-enterprise-no-license
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn build-renders-enterprise
          else
            yarn build-renders
          fi

      - name: 准备并校验 Windows x64 引擎
        if: ${{ inputs.include_engine }}
        id: engine
        shell: bash
        env:
          REQUESTED_ENGINE_VERSION: ${{ inputs.engine_version }}
          ENGINE_ASSET: yak_windows_amd64.exe
          DEFER_ENGINE_ARCHIVE: 'false'
        run: |
          if [ "${THE_LEGACY}" != "true" ]; then
            node packageScript/script/prepare-renyan-engine.js prepare
          else
            node packageScript/script/prepare-renyan-engine.js prepare-windows-legacy
          fi

      - name: 生成 RuiYan Windows x64 安装文件
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
        run: |
          if [ "${PACKAGE_EDITION}" = "enterprise-no-license" ]; then
            yarn pack-renyan-win-x64-enterprise-no-license-unsigned
          elif [ "${PACKAGE_EDITION}" = "enterprise" ]; then
            yarn pack-renyan-win-x64-enterprise-unsigned
          else
            yarn pack-renyan-win-x64-unsigned
          fi

      - name: 签名 RuiYan Windows x64 安装文件
        if: ${{ inputs.sign_installers }}
        uses: ./.github/actions/sign-windows
        with:
          path: release
          pattern: '*windows-x64.exe'
          key-vault-url: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_URI }}
          key-vault-client-id: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_APPLICATION_ID }}
          key-vault-tenant-id: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_DIRECTORY_ID }}
          key-vault-client-secret: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_CLIENT_SECRET }}
          key-vault-certificate: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_CERT_NAME }}
          timestamp-url: ${{ secrets.AZURE_YAK_CODE_SIGN_KEY_VAULT_TIMESTAMP_URL }}

      - name: 验证成品引擎、签名与应用启动
        shell: bash
        env:
          PACKAGE_TARGET: windows-x64
          PACKAGE_SIGNED: ${{ inputs.sign_installers }}
        run: node packageScript/script/verify-renyan-package.js

      - name: 生成 RuiYan 构建清单与摘要
        id: metadata
        shell: bash
        env:
          PACKAGE_EDITION: ${{ inputs.edition }}
          PACKAGE_TARGET: windows-x64
          PACKAGE_SIGNED: ${{ inputs.sign_installers }}
          INCLUDE_ENGINE: ${{ inputs.include_engine }}
        run: |
          if [ "${THE_LEGACY}" != "true" ]; then
            node packageScript/script/create-renyan-build-metadata.js
          else
            node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const { createBuildMetadata, calculateSha256, parseBoolean, writeWorkflowValue } = require('./packageScript/script/create-renyan-build-metadata')

          async function run() {
            const result = await createBuildMetadata({
              edition: process.env.PACKAGE_EDITION,
              target: process.env.PACKAGE_TARGET,
              signed: parseBoolean(process.env.PACKAGE_SIGNED),
              includeEngine: parseBoolean(process.env.INCLUDE_ENGINE),
            })
            const manifest = result.manifest
            const fileName = manifest.artifactFile.replace(/-(windows|linux)-(x64|arm64)\.(exe|AppImage)$/, '-$1-legacy-$2.$3')
            if (fileName === manifest.artifactFile) throw new Error('兼容安装文件的名称不符合预期')
            const artifactPath = path.join(path.dirname(result.artifactPath), fileName)
            fs.copyFileSync(result.artifactPath, artifactPath, fs.constants.COPYFILE_EXCL)
            if (await calculateSha256(artifactPath) !== manifest.artifactSha256) throw new Error('兼容安装文件复制后摘要不一致')
            manifest.artifactFile = fileName
            manifest.legacy = true
            fs.writeFileSync(result.manifestPath, `${JSON.stringify(manifest, null, 2)}\n`, 'utf8')
            fs.writeFileSync(result.checksumPath, `${manifest.artifactSha256}  ${fileName}\n`, 'utf8')
            writeWorkflowValue(process.env.GITHUB_OUTPUT, 'artifact_path', path.relative(process.cwd(), artifactPath).replace(/\\/g, '/'))
            writeWorkflowValue(process.env.GITHUB_OUTPUT, 'artifact_container', `${result.artifactContainer}-legacy`)
            console.log(`兼容安装文件：${fileName}`)
          }
          run().catch((error) => {
            console.error(error.message)
            process.exitCode = 1
          })
          NODE
          fi

      - name: 上传 RuiYan Windows x64 产物
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.metadata.outputs.artifact_path }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}

      - name: 上传 Windows legacy 构建及宿主检查证据
        if: ${{ always() && inputs.legacy }}
        uses: actions/upload-artifact@v7
        with:
          name: RuiYan-windows-legacy-evidence

            reports/junit.xml
            reports/windows-legacy-*.junit.xml
            reports/windows-legacy-*.log
            reports/windows-legacy-host.json
            release/build-manifest.json
            release/SHA256SUMS.txt
            bins/yak_windows_amd64.zip.verified.json
            ${{ env.WINDOWS_LEGACY_BUNDLE }}/build.json
            ${{ env.WINDOWS_LEGACY_BUNDLE }}/imports.json
            ${{ env.WINDOWS_LEGACY_BUNDLE }}/yak.exe.sha256.txt
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}


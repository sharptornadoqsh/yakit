        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/renderer/src/main/yarn.lock
            app/renderer/engine-link-startup/yarn.lock

      - name: 安装固定依赖
